<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGSE611 - Grade Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333333;
            margin: 50px;
        }

        .box {
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            border-radius: 5px;
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        #output {
            margin-top: 15px;
            background-color: #e9e9e9;
            padding: 10px;
            border: 1px dashed #999;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>โปรแกรมเช็คเกรด</h3>
        <button onclick="checkGrade()">Run Code</button>
        <div id="output">แสดงผลตรงนี้...</div>
    </div>

    <script>
        function checkGrade() {
        
            let score = Math.floor(Math.random() * 101); 

            let grade = "";
            let result = "";

            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            // 4. เงื่อนไขตรวจสอบ "ผ่าน / ไม่ผ่าน"
            if (score >= 50) {
                result = "ผ่าน";
            } else {
                result = "ไม่ผ่าน";
            }

            console.log("=== ผลการทำงานของระบบ ===");
            console.log("คะแนนที่สุ่มได้:", score);
            console.log("เกรด:", grade);
            console.log("ผลสอบ:", result);

            let outputDiv = document.getElementById("output");
            outputDiv.innerHTML = `
                คะแนนที่สุ่มได้: ${score} <br>
                เกรด: ${grade} <br>
                ผลสอบ: ${result}
            `;
        }
    </script>

</body>
</html>
